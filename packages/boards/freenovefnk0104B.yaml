packages:
  hardware: !include ../hardware/esp-idf.yaml
  look: !include ../looks/compact.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml
  camera: !include ../features/camera.yaml
  
substitutions:
  BOARD_ID: "freenovefnk0104B"
  DEVICE_NAME: "freenovefnk0104B-new"
  DEVICE_FRIENDLY_NAME: "My Freenove FNK0104B"

  BEDSIDE_OWN_DIGITS: "0"

  PANEL_W: "240"
  PANEL_H: "320"
  DISPLAY_DPI: "143"
  
  ROTATION_LANDSCAPE: "90"
  
  GRID_COLS: "2"
  GRID_ROWS: "3"
  
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  LVGL_BUFFER_SIZE: "100%"                       # LVGL's draw buffer as a share of the screen

  DISPLAY_MODEL: "ILI9341"                      # ESPHome's mipi_spi model of the display controller
  DISPLAY_DATA_RATE: "40MHz"                    # the display's SPI clock; 40MHz matches ESPHome's board preset
  DISPLAY_INVERT_COLORS: "true"
  BACKLIGHT_FREQUENCY: "1000Hz"                 # the backlight's PWM; see the output block (GitHub #42)

  TOUCH_CAL_X_MIN: "280"
  TOUCH_CAL_X_MAX: "3860"
  TOUCH_CAL_Y_MIN: "340"
  TOUCH_CAL_Y_MAX: "3860"

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: touch_bus
    sda: GPIO16
    scl: GPIO15
    scan: true

spi:
  - id: lcd
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

output:
  - platform: ledc
    pin: GPIO45
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO42
    num_leds: 1
    chipset: ws2812
    name: "Status LED"
    id: my_status_led
    
    # Optional: Add some fun effects
    effects:
      - addressable_rainbow:
          name: Rainbow
      - pulse:
          name: Slow Pulse

touchscreen:
  - platform: ft63x6
    id: ts_touch
    i2c_id: touch_bus
    interrupt_pin: GPIO17

display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ${DISPLAY_MODEL}
    cs_pin: GPIO10
    dc_pin: GPIO46
    invert_colors: ${DISPLAY_INVERT_COLORS}
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 240
      height: 320